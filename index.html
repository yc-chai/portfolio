<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tilt+Neon&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="index.css" />

    <script defer src="index.js"></script>

    <link
      href="content.json"
      rel="preload"
      as="fetch"
      type="application/json"
      crossorigin="anonymous"
    />

    <title>Portfolio Website</title>
  </head>

  <body>
    <div class="frame">
      <div class="content">
        <header>
          <div>
            <!-- Hero Section -->
            <div class="intro">
              <h1 id="hero-name">Yong Chen</h1>
              <h2 id="hero-title">Junior Full Stack Developer</h2>
              <p id="hero-description">
                I build applications from start to finish, turning ideas into
                solutions.
              </p>
            </div>

            <!-- Navigation -->
            <nav>
              <ul>
                <li>
                  <a href="#about" class="nav-link active"
                    ><span></span><span>ABOUT</span></a
                  >
                </li>
                <li>
                  <a href="#experience" class="nav-link"
                    ><span></span><span>EXPERIENCE</span></a
                  >
                </li>
                <li>
                  <a href="#projects" class="nav-link"
                    ><span></span><span>PROJECTS</span></a
                  >
                </li>
              </ul>
            </nav>
          </div>

          <!-- Social Media Links -->
          <div class="social-media-list">
            <ul id="social-links">
              <li>
                <div class="skeleton" style="width: 40px; height: 40px"></div>
              </li>
              <li>
                <div class="skeleton" style="width: 40px; height: 40px"></div>
              </li>
            </ul>
          </div>
        </header>

        <main>
          <!-- About -->
          <section id="about" class="main-section about">
            <div>
              <div><h2 class="nav-header">About</h2></div>
              <div class="description about" id="about-content"></div>
            </div>
          </section>

          <!-- Experience -->
          <section id="experience" class="main-section experience">
            <div>
              <div><h2 class="nav-header">Experience</h2></div>
              <ol class="list experience" id="experience-list"></ol>
            </div>
          </section>

          <!-- Projects -->
          <section id="projects" class="main-section projects">
            <div>
              <div><h2 class="nav-header">Projects</h2></div>
              <ul class="list projects" id="projects-list"></ul>
            </div>
          </section>

          <footer>
            <p>© 2025 Yong Chen's portfolio. All rights reserved.</p>
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
